<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人云端导航</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary: #2563eb;
      --hover-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #334155;
        --primary: #3b82f6;
        --hover-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .container { width: 100%; max-width: 1080px; }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2.5rem;
      gap: 1.25rem;
    }

    .search-box {
      width: 100%;
      max-width: 540px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 0.85rem 1.25rem;
      font-size: 1rem;
      border-radius: 9999px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      outline: none;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    .category-section { margin-bottom: 2.5rem; }
    
    .category-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 1rem;
      padding-left: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }

    .nav-card {
      display: flex;
      align-items: center;
      padding: 0.85rem 1rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
      gap: 0.85rem;
    }

    .nav-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--hover-shadow);
      border-color: var(--primary);
    }

    .card-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--border-color);
    }

    .card-content {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      gap: 0.2rem;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 3rem 0;
      font-size: 0.95rem;
    }

    .admin-link {
      margin-top: auto;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 1rem 0;
    }
    .admin-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>我的导航</h1>
      <div class="search-box">
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="搜索站点名称或描述... (按 / 聚焦)" 
          autocomplete="off"
        >
      </div>
    </header>

    <main id="navContainer">
      <div class="empty-state">正在从边缘节点加载数据...</div>
    </main>
  </div>

  <a href="/admin.html" class="admin-link">⚙️ 管理后台</a>

  <script>
    let fullNavData = [];

    // 默认内置兜底数据（防止初次部署 KV 为空时页面完全空白）
    const defaultData = [
      {
        category: "常用推荐",
        items: [
          { name: "GitHub", url: "https://github.com", desc: "全球最大的代码托管与开源平台" },
          { name: "Cloudflare", url: "https://dash.cloudflare.com", desc: "网络安全与边缘计算平台" }
        ]
      }
    ];

    // 获取 Favicon 地址，若数据中未填则自动调用 Google 图标解析服务
    function getIconUrl(item) {
      if (item.icon && item.icon.trim() !== '') return item.icon;
      try {
        const domain = new URL(item.url).hostname;
        return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
      } catch {
        return 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text y="20" font-size="20">🔗</text></svg>';
      }
    }

    // 渲染导航列表与分类
    function renderNav(data) {
      const container = document.getElementById('navContainer');
      container.innerHTML = '';

      let totalRendered = 0;

      data.forEach(cat => {
        if (!cat.items || cat.items.length === 0) return;

        const section = document.createElement('section');
        section.className = 'category-section';

        const title = document.createElement('h2');
        title.className = 'category-title';
        title.textContent = cat.category;
        section.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'grid';

        cat.items.forEach(item => {
          totalRendered++;
          const card = document.createElement('a');
          card.className = 'nav-card';
          card.href = item.url;
          card.target = '_blank';
          card.rel = 'noopener noreferrer';

          const icon = document.createElement('img');
          icon.className = 'card-icon';
          icon.src = getIconUrl(item);
          icon.alt = item.name;
          icon.loading = 'lazy';
          icon.onerror = () => {
            icon.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text y="18" font-size="18">🌐</text></svg>';
          };

          const content = document.createElement('div');
          content.className = 'card-content';

          const name = document.createElement('div');
          name.className = 'card-title';
          name.textContent = item.name;

          const desc = document.createElement('div');
          desc.className = 'card-desc';
          desc.textContent = item.desc || item.url;

          content.appendChild(name);
          content.appendChild(desc);
          card.appendChild(icon);
          card.appendChild(content);
          grid.appendChild(card);
        });

        section.appendChild(grid);
        container.appendChild(section);
      });

      if (totalRendered === 0) {
        container.innerHTML = '<div class="empty-state">没有找到匹配的网站</div>';
      }
    }

    // 实时搜索过滤逻辑
    function handleSearch(event) {
      const query = event.target.value.trim().toLowerCase();
      if (!query) {
        renderNav(fullNavData);
        return;
      }

      const filtered = fullNavData.map(cat => {
        const matchedItems = (cat.items || []).filter(item => 
          (item.name && item.name.toLowerCase().includes(query)) ||
          (item.desc && item.desc.toLowerCase().includes(query)) ||
          (item.url && item.url.toLowerCase().includes(query))
        );
        return { ...cat, items: matchedItems };
      }).filter(cat => cat.items.length > 0);

      renderNav(filtered);
    }

    // 页面加载并请求后端 API
    async function init() {
      try {
        const res = await fetch('/api/nav');
        if (!res.ok) throw new Error('API 请求失败');
        
        const data = await res.json();
        fullNavData = Array.isArray(data) && data.length > 0 ? data : defaultData;
      } catch (err) {
        console.warn('读取边缘接口失败，使用默认兜底配置:', err);
        fullNavData = defaultData;
      }
      renderNav(fullNavData);
    }

    // 快捷键支持：按 '/' 聚焦搜索框，按 'Esc' 清空
    document.addEventListener('keydown', (e) => {
      const searchInput = document.getElementById('searchInput');
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      } else if (e.key === 'Escape' && document.activeElement === searchInput) {
        searchInput.value = '';
        renderNav(fullNavData);
        searchInput.blur();
      }
    });

    document.getElementById('searchInput').addEventListener('input', handleSearch);
    init();
  </script>
</body>
</html>
